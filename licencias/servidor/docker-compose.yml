# Despliegue en el VPS (Docker + Caddy delante). Los secretos van en .env junto a este archivo (NO se sube a git):
#   LICENCIA_ADMIN_TOKEN=...        LICENCIA_CLAVE_PRIVADA=<contenido del privada.pem con \n en vez de saltos de linea>
# Solo escucha en 127.0.0.1: Caddy publica HTTPS.
services:
  licencias:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - licencias-datos:/data
volumes:
  licencias-datos:
